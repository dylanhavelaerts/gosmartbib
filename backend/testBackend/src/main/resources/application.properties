spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Database configuratie
spring.datasource.url=jdbc:mysql://localhost:3307/gosmartlib
spring.datasource.username=admin
spring.datasource.password=admin

# JPA and Hibernate configuratie
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Google Books API configuration
google.books.api.url=https://www.googleapis.com/books/v1/volumes
google.books.api.key=${APIKEY:}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Smartschool OAuth2 Configuratie
# credentials and client details
spring.security.oauth2.client.registration.smartschool.client-id=${SMARTSCHOOL_CLIENT_ID}
spring.security.oauth2.client.registration.smartschool.client-secret=${SMARTSCHOOL_CLIENT_SECRET}

# OAuth2 flow details
spring.security.oauth2.client.registration.smartschool.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.smartschool.client-authentication-method=client_secret_post

# Redirection URL
spring.security.oauth2.client.registration.smartschool.redirect-uri={baseUrl}/login/oauth2/code/smartschool

# Provider details
spring.security.oauth2.client.provider.smartschool.authorization-uri=https://aphogeschool.smartschool.be/OAuth
spring.security.oauth2.client.provider.smartschool.token-uri=https://aphogeschool.smartschool.be/OAuth/index/token
spring.security.oauth2.client.provider.smartschool.user-info-uri=https://aphogeschool.smartschool.be/Api/V1/userinfo
spring.security.oauth2.client.provider.smartschool.user-name-attribute=uid


# Forward headers configuratie voor reverse proxy ondersteuning
server.forward-headers-strategy=framework