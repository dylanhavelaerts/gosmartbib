spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.config.import=optional:configtree:/run/secrets/

# Database configuratie
spring.datasource.url=jdbc:mysql://localhost:3307/gosmartlib
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# JPA and Hibernate configuratie
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Google Books API configuration
google.books.api.url=https://www.googleapis.com/books/v1/volumes
google.books.api.key=${GOOGLE_BOOKS_API_KEY:}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Review moderation configuratie
review.moderation.blocked-words-resource=classpath:moderation/blocked-review-words.txt
review.moderation.max-links-in-review=3

# Smartschool OAuth2 Configuratie
# credentials and client details
spring.security.oauth2.client.registration.smartschool.client-id=${SMARTSCHOOL_CLIENT_ID:}
spring.security.oauth2.client.registration.smartschool.client-secret=${SMARTSCHOOL_CLIENT_SECRET:}

# OAuth2 flow details
spring.security.oauth2.client.registration.smartschool.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.smartschool.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.smartschool.scope=fulluserinfo,groupinfo

# Redirection URL
spring.security.oauth2.client.registration.smartschool.redirect-uri={baseUrl}/login/oauth2/code/smartschool

# Provider details
spring.security.oauth2.client.provider.smartschool.authorization-uri=https://aphogeschool.smartschool.be/OAuth
spring.security.oauth2.client.provider.smartschool.token-uri=https://aphogeschool.smartschool.be/OAuth/index/token
spring.security.oauth2.client.provider.smartschool.user-info-uri=https://aphogeschool.smartschool.be/Api/V1/fulluserinfo
spring.security.oauth2.client.provider.smartschool.user-name-attribute=userID


# Forward headers configuratie voor reverse proxy ondersteuning
server.forward-headers-strategy=framework

# Cookies
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.path=/
server.servlet.session.cookie.name=JSESSIONID