spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

app.frontend.base-url=http://localhost:3000
app.crypto.password=test-password-minimum-32-characters
app.crypto.salt=deadbeefcafe1234

google.books.api.key=dummy-key
google.books.api.url=https://www.googleapis.com/books/v1/volumes

spring.security.oauth2.client.registration.smartschool.client-id=test-client
spring.security.oauth2.client.registration.smartschool.client-secret=test-secret
spring.security.oauth2.client.provider.smartschool.authorization-uri=http://localhost/oauth/authorize
spring.security.oauth2.client.provider.smartschool.token-uri=http://localhost/oauth/token
spring.security.oauth2.client.provider.smartschool.user-info-uri=http://localhost/oauth/userinfo
spring.security.oauth2.client.provider.smartschool.user-name-attribute=userID

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.data.jpa.repositories.bootstrap-mode=lazy

review.moderation.blocked-words-resource=classpath:moderation/blocked-review-words.txt
review.moderation.max-links-in-review=3
