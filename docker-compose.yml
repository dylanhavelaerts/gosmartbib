services:
  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://gosmartbib.tech/api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`gosmartbib.tech`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    networks:
      - proxy
    depends_on:
      - backend

  backend:
    build: ./backend/testBackend
    container_name: backend
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/gosmartlib
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      SERVER_SERVLET_CONTEXT_PATH: /api
      SERVER_SERVLET_CONTEXT_PATH: /api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`gosmartbib.tech`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
    networks:
      - proxy
      - backend
    depends_on:
      - database

  database:
    image: mysql:8.0
    container_name: database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Root
      MYSQL_DATABASE: gosmartlib
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend

networks:
  proxy:
    external: true
  backend:
    name: backend
    driver: bridge

volumes:
  mysql_data:
    driver: local
