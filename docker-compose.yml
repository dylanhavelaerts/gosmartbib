services:
  traefik:
    image: traefik:v3.6.7
    container_name: traefik
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/letsencrypt:/letsencrypt
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=s149186@ap.be"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`dashboard.gosmartbib.tech`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
    networks:
      - proxy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://gosmartbib.tech/api
    container_name: frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://gosmartbib.tech/api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`gosmartbib.tech`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    networks:
      - proxy
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: backend
    restart: on-failure
    environment:
      SPRING_PROFILES_ACTIVE: prod

      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/gosmartlib

      SERVER_SERVLET_CONTEXT_PATH: /api
      SERVER_FORWARD_HEADERS_STRATEGY: framework

      SMARTSCHOOL_CLIENT_ID: ${SMARTSCHOOL_CLIENT_ID}
      SMARTSCHOOL_CLIENT_SECRET: ${SMARTSCHOOL_CLIENT_SECRET}
    secrets:
      - GOOGLE_BOOKS_API_KEY
      - DB_USERNAME
      - DB_PASSWORD
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`gosmartbib.tech`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
    networks:
      - proxy
      - backend
    depends_on:
      - database

  database:
    image: mysql:8.0
    container_name: database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/DB_ROOT_PASSWORD
      MYSQL_DATABASE: gosmartlib
      MYSQL_USER_FILE: /run/secrets/DB_USERNAME
      MYSQL_PASSWORD_FILE: /run/secrets/DB_PASSWORD
    secrets:
      - DB_ROOT_PASSWORD
      - DB_USERNAME
      - DB_PASSWORD
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend

networks:
  proxy:
    external: true
  backend:
    name: backend
    driver: bridge

volumes:
  mysql_data:
    driver: local

secrets:
  GOOGLE_BOOKS_API_KEY:
    environment: GOOGLE_BOOKS_API_KEY
  DB_USERNAME:
    environment: DB_USERNAME
  DB_PASSWORD:
    environment: DB_PASSWORD
  DB_ROOT_PASSWORD:
    environment: DB_ROOT_PASSWORD
